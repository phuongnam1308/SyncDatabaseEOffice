<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Migration API</title>

  <link
    rel="stylesheet"
    href="swagger-ui.css"
  />
</head>
<body>

<div id="swagger-ui"></div>

<script src="swagger-ui-bundle.js"></script>
<script src="swagger-ui-standalone-preset.js"></script>

<script>
  window.onload = () => {
    SwaggerUIBundle({
      url: '/swagger.json',
      dom_id: '#swagger-ui',
      presets: [
        SwaggerUIBundle.presets.apis,
        SwaggerUIStandalonePreset
      ],
      layout: 'StandaloneLayout'
    });
  };
</script>

</body>
</html>
